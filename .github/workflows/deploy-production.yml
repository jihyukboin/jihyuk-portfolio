name: Deploy production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    env:
      DEPLOY_ARCHIVE: jihyuk-portfolio-${{ github.sha }}.tar.gz
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Package committed source
        run: git archive --format=tar.gz --output="$DEPLOY_ARCHIVE" "$GITHUB_SHA"

      - name: Configure SSH
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_KNOWN_HOSTS: ${{ secrets.OCI_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$OCI_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Synchronize production environment
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          environment_file="$RUNNER_TEMP/production.env"
          remote_environment_file="/opt/jihyuk-portfolio/shared/.production.env-$GITHUB_SHA"
          umask 077
          {
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL"
            printf 'NEXT_PUBLIC_GA_MEASUREMENT_ID=%s\n' "$NEXT_PUBLIC_GA_MEASUREMENT_ID"
          } > "$environment_file"
          ssh "$OCI_USER@$OCI_HOST" "install -d -m 700 /opt/jihyuk-portfolio/shared"
          scp "$environment_file" "$OCI_USER@$OCI_HOST:$remote_environment_file"
          ssh "$OCI_USER@$OCI_HOST" \
            "chmod 600 '$remote_environment_file' && mv -f '$remote_environment_file' /opt/jihyuk-portfolio/shared/production.env"
          rm -f "$environment_file"

      - name: Synchronize OCI service
        run: |
          remote_service=".config/systemd/user/.jihyuk-portfolio.service-$GITHUB_SHA"
          scp ops/oci/jihyuk-portfolio.service "$OCI_USER@$OCI_HOST:$remote_service"
          ssh "$OCI_USER@$OCI_HOST" \
            "chmod 644 '$remote_service' && mv -f '$remote_service' .config/systemd/user/jihyuk-portfolio.service && XDG_RUNTIME_DIR=/run/user/\$(id -u) systemctl --user daemon-reload && XDG_RUNTIME_DIR=/run/user/\$(id -u) systemctl --user enable jihyuk-portfolio.service"

      - name: Upload release source
        run: scp "$DEPLOY_ARCHIVE" "$OCI_USER@$OCI_HOST:/tmp/$DEPLOY_ARCHIVE"

      - name: Deploy release on OCI
        run: |
          ssh "$OCI_USER@$OCI_HOST" \
            "bash -s -- '$GITHUB_SHA' '/tmp/$DEPLOY_ARCHIVE'" < ops/oci/deploy

      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
